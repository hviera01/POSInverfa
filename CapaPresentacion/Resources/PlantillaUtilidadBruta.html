<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }

        .resumen {
            margin-top: 30px;
            font-size: 16px;
        }

            .resumen span {
                font-weight: bold;
            }
    </style>
</head>
<body>
    <h1>REPORTE DE UTILIDAD BRUTA</h1>
    <p><strong>Desde:</strong> @fechainicio &nbsp;&nbsp;&nbsp; <strong>Hasta:</strong> @fechafin</p>

    <table>
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Número</th>
                <th>Cliente</th>
                <th>Vendedor</th>
                <th>Método de Pago</th>
                <th>Total Venta</th>
                <th>Costo Total</th>
                <th>Utilidad Bruta</th>
            </tr>
        </thead>
        <tbody>
            @tabla
        </tbody>
    </table>

    <div class="resumen">
        <p><span>Total Venta:</span> L. @totalventa</p>
        <p><span>Total Costo:</span> L. @totalcosto</p>
        <p><span>Utilidad Bruta:</span> L. @totalutilidad</p>
    </div>
</body>
</html>
